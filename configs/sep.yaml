# Focused config to MAKE THE PARADIGM SEPARATION VISIBLE in one run.
# Sizes chosen at the knees from the probe:
#   linear (gap/config/knapsack) large -> OMT (z3) times out, open MILP cruises
#   jobshop                            -> big-M MILP explodes, OMT/CP stay low
name: sep
timeout: 30
seeds: 1
anytime: true
families:
  gap:      [80, 160, 320]
  config:   [100, 200, 400]
  knapsack: [320, 640]
  jobshop:  [6, 8, 10]
