# Calibration probe: find where each family starts to separate the solvers.
# Large sizes, 1 seed, short timeout -> locate the "knee" per family, then set
# full.yaml accordingly. Not a results config.
name: probe
timeout: 30
seeds: 1
anytime: true
families:
  gap:      [80, 160, 320]
  knapsack: [80, 160, 320, 640]
  jobshop:  [8, 10, 12, 16]
  config:   [100, 200, 400, 800]
  setcover: [40, 80, 160, 320]
  bvcover:  [32, 48, 64, 96]
