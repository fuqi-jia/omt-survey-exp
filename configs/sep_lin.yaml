# All linear/regular-logic sizes from the separation table, for the full-CPLEX
# column (run cplex-ind via .venv-cplex; small instances also get full Gurobi
# from the Windows run).
name: sep_lin
timeout: 30
seeds: 1
families:
  gap:      [80, 160, 320, 640]
  config:   [100, 200, 400, 800]
  knapsack: [320, 640, 1280, 2560]
